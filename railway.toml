[build]
builder           = "DOCKERFILE"
dockerfilePath    = "Dockerfile"
dockerBuildTarget = "production"

[deploy]
healthcheckPath        = "/api/health"
healthcheckTimeout     = 120
restartPolicyType      = "ON_FAILURE"
restartPolicyMaxRetries = 3
